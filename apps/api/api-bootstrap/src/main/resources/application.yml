server:
  port: ${API_PORT:8080}

spring:
  application:
    name: amrap-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:amrap}
    username: ${POSTGRES_USER:amrap}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # Used by Spring AI auto-config; answer path uses amrap.chat.answer-model.
          model: ${OLLAMA_ANSWER_MODEL:${OLLAMA_CHAT_MODEL:qwen2.5:7b}}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never
    vectorstore:
      pgvector:
        # Table + extension are created by V3__results_rag.sql; let it alone.
        initialize-schema: false
        schema-name: public
        table-name: result_chunks
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

amrap:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rag:
    storage-dir: ${RESULTS_STORAGE_DIR:./data/results}
    ingest-api-key: ${INGEST_API_KEY}
    worker-delay-ms: ${RAG_WORKER_DELAY_MS:10000}
    worker-batch-size: ${RAG_WORKER_BATCH_SIZE:5}
    chunk-size: ${RAG_CHUNK_SIZE:800}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
    top-k: ${RAG_TOP_K:6}
    # IANA zone used for "today"/"yesterday" in chat and for generated iteration IDs.
    # Empty means the JVM default.
    timezone: ${TZ:}
  chat:
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    classify-model: ${OLLAMA_CLASSIFY_MODEL:qwen2.5:3b}
    sql-model: ${OLLAMA_SQL_MODEL:qwen2.5-coder:7b}
    # Answer model; OLLAMA_CHAT_MODEL kept as fallback for older env files.
    answer-model: ${OLLAMA_ANSWER_MODEL:${OLLAMA_CHAT_MODEL:qwen2.5:7b}}
    sql-max-rows: ${CHAT_SQL_MAX_ROWS:200}
    sql-timeout-ms: ${CHAT_SQL_TIMEOUT_MS:3000}
    ollama-timeout-ms: ${OLLAMA_TIMEOUT_MS:120000}
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:amrap}
      username: ${CHAT_DB_USER:amrap_chat_ro}
      password: ${CHAT_DB_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
