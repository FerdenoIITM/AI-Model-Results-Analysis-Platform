openapi: 3.0.3
info:
  title: AI Model Results Analysis Platform API
  version: 0.4.0
  description: Auth, User Management, Result Ingestion, Filtering, and RAG Chat
servers:
  - url: http://localhost:8080/api
    description: Local API

paths:
  /auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Inactive account

  /auth/me:
    get:
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'

  /users:
    get:
      summary: List users visible to the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '403':
          description: Forbidden for members
    post:
      summary: Create admin or member (role rules enforced)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'

  /users/{id}:
    patch:
      summary: Update user fields / role / active flag
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'

  /users/{id}/deactivate:
    post:
      summary: Soft-deactivate a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'

  /results:
    get:
      summary: List ingested results
      description: |
        Filters, then sorts, then paginates in the database. Unknown query keys are rejected.
        Category and subcategory match exactly and may be repeated. Numeric filters use a suffix
        on the camelCase field: Eq, Gt, Gte, Lt, Lte. A range is a lower bound plus an upper bound
        on the same field. Metrics are percentage points from 0 to 100.
        Sort is a whitelisted field with an optional leading `-` for descending. Default sort is
        `-insertedAt`. Null metric values sort last.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/SubCategoryQuery'
        - name: modelName
          in: query
          schema:
            type: string
            maxLength: 255
          description: Case-insensitive substring match
        - name: version
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive substring match
        - name: vectorized
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          schema:
            type: string
            default: "-insertedAt"
          description: >
            Whitelist: insertedAt, modelName, version, iterationId, category, subCategory,
            confidenceAccuracy, sensitivity, specificity, f1Score, recall, precision.
            Prefix `-` for descending.
        - $ref: '#/components/parameters/ConfidenceAccuracyEq'
        - $ref: '#/components/parameters/ConfidenceAccuracyGt'
        - $ref: '#/components/parameters/ConfidenceAccuracyGte'
        - $ref: '#/components/parameters/ConfidenceAccuracyLt'
        - $ref: '#/components/parameters/ConfidenceAccuracyLte'
        - $ref: '#/components/parameters/SensitivityEq'
        - $ref: '#/components/parameters/SensitivityGt'
        - $ref: '#/components/parameters/SensitivityGte'
        - $ref: '#/components/parameters/SensitivityLt'
        - $ref: '#/components/parameters/SensitivityLte'
        - $ref: '#/components/parameters/SpecificityEq'
        - $ref: '#/components/parameters/SpecificityGt'
        - $ref: '#/components/parameters/SpecificityGte'
        - $ref: '#/components/parameters/SpecificityLt'
        - $ref: '#/components/parameters/SpecificityLte'
        - $ref: '#/components/parameters/F1ScoreEq'
        - $ref: '#/components/parameters/F1ScoreGt'
        - $ref: '#/components/parameters/F1ScoreGte'
        - $ref: '#/components/parameters/F1ScoreLt'
        - $ref: '#/components/parameters/F1ScoreLte'
        - $ref: '#/components/parameters/RecallEq'
        - $ref: '#/components/parameters/RecallGt'
        - $ref: '#/components/parameters/RecallGte'
        - $ref: '#/components/parameters/RecallLt'
        - $ref: '#/components/parameters/RecallLte'
        - $ref: '#/components/parameters/PrecisionEq'
        - $ref: '#/components/parameters/PrecisionGt'
        - $ref: '#/components/parameters/PrecisionGte'
        - $ref: '#/components/parameters/PrecisionLt'
        - $ref: '#/components/parameters/PrecisionLte'
      responses:
        '200':
          description: Filtered page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPage'
        '400':
          description: Invalid filter, sort, or page
    post:
      summary: Ingest a new model result (JSON payload is stored on disk)
      description: |
        Normal path is `X-Ingest-Key` (machine clients: Postman, scripts, imported OpenAPI).
        A Bearer JWT is accepted only when the user is superadmin (website fallback).
        Admin and member JWTs receive 403. The `payload` field is stored verbatim as a
        JSON file; metadata goes into the `results` table with `is_vectorized=false`.
        A background worker will chunk + embed the content and flip the flag to `true`.
        `iterationId` is assigned by the server as local `yyyyMMddHHmmss` (for example `20261006135322`).
        A client-supplied `iterationId` is ignored.
      security:
        - bearerAuth: []
        - ingestKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResultRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSummary'
        '400':
          description: Invalid metadata or metric value
        '403':
          description: Authenticated user is not superadmin

  /results/filter-options:
    get:
      summary: Distinct category and subcategory values for the filter UI
      description: |
        `categories` is always the full distinct set. Repeat `category` to limit `subCategories`
        to values that occur with those categories. Omit `category` to list every subcategory.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
      responses:
        '200':
          description: Filter choices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
        '400':
          description: Invalid category or unsupported query key

  /results/{id}:
    get:
      summary: Get a result's metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSummary'

  /results/{id}/payload:
    get:
      summary: Download the raw JSON payload of a result
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Raw JSON content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /results/reindex:
    post:
      summary: Clear vector store and mark all results for re-vectorization (superadmin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reindex scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: integer
                  message:
                    type: string

  /chat:
    post:
      summary: Ask a natural-language question over ingested results (RAG)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Answer with citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

components:
  parameters:
    CategoryQuery:
      name: category
      in: query
      description: Repeat for more than one category
      schema:
        type: array
        items:
          type: string
          maxLength: 120
      style: form
      explode: true
    SubCategoryQuery:
      name: subCategory
      in: query
      description: Repeat for more than one subcategory
      schema:
        type: array
        items:
          type: string
          maxLength: 120
      style: form
      explode: true
    ConfidenceAccuracyEq:
      name: confidenceAccuracyEq
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    ConfidenceAccuracyGt:
      name: confidenceAccuracyGt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    ConfidenceAccuracyGte:
      name: confidenceAccuracyGte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    ConfidenceAccuracyLt:
      name: confidenceAccuracyLt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    ConfidenceAccuracyLte:
      name: confidenceAccuracyLte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SensitivityEq:
      name: sensitivityEq
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SensitivityGt:
      name: sensitivityGt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SensitivityGte:
      name: sensitivityGte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SensitivityLt:
      name: sensitivityLt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SensitivityLte:
      name: sensitivityLte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SpecificityEq:
      name: specificityEq
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SpecificityGt:
      name: specificityGt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SpecificityGte:
      name: specificityGte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SpecificityLt:
      name: specificityLt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    SpecificityLte:
      name: specificityLte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    F1ScoreEq:
      name: f1ScoreEq
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    F1ScoreGt:
      name: f1ScoreGt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    F1ScoreGte:
      name: f1ScoreGte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    F1ScoreLt:
      name: f1ScoreLt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    F1ScoreLte:
      name: f1ScoreLte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    RecallEq:
      name: recallEq
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    RecallGt:
      name: recallGt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    RecallGte:
      name: recallGte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    RecallLt:
      name: recallLt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    RecallLte:
      name: recallLte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    PrecisionEq:
      name: precisionEq
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    PrecisionGt:
      name: precisionGt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    PrecisionGte:
      name: precisionGte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    PrecisionLt:
      name: precisionLt
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
    PrecisionLte:
      name: precisionLte
      in: query
      schema: { type: number, minimum: 0, maximum: 100 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ingestKey:
      type: apiKey
      in: header
      name: X-Ingest-Key
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [superadmin, admin, member]
        createdBy:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [email, password, displayName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, member]
        active:
          type: boolean
    ResultSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        modelName:
          type: string
        version:
          type: string
        iterationId:
          type: string
          description: Server-assigned local timestamp, yyyyMMddHHmmss
          example: "20261006135322"
        category:
          type: string
          nullable: true
          maxLength: 120
        subCategory:
          type: string
          nullable: true
          maxLength: 120
        confidenceAccuracy:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentage points, not a 0-1 fraction
        sensitivity:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        specificity:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        f1Score:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        recall:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        precision:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        jsonPath:
          type: string
          description: Relative path under RESULTS_STORAGE_DIR
        sizeBytes:
          type: integer
          format: int64
        insertedAt:
          type: string
          format: date-time
        vectorized:
          type: boolean
        vectorizedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
    ResultPage:
      type: object
      required: [results, total, page, pageSize]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ResultSummary'
        total:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    FilterOptions:
      type: object
      required: [categories, subCategories]
      properties:
        categories:
          type: array
          items:
            type: string
        subCategories:
          type: array
          items:
            type: string
    CreateResultRequest:
      type: object
      required: [modelName, version, payload]
      properties:
        modelName:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 100
        category:
          type: string
          nullable: true
          maxLength: 120
        subCategory:
          type: string
          nullable: true
          maxLength: 120
        confidenceAccuracy:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        sensitivity:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        specificity:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        f1Score:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        recall:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        precision:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        payload:
          type: object
          additionalProperties: true
          description: Arbitrary JSON. Stored verbatim on disk; keys are flattened by the worker.
    ChatRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        modelName:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        iterationId:
          type: string
          nullable: true
        fromIso:
          type: string
          format: date-time
          nullable: true
        toIso:
          type: string
          format: date-time
          nullable: true
        history:
          type: array
          nullable: true
          description: >
            Every previous user and assistant text in the current browser session, oldest first,
            not including the new question. Omit after the conversation is cleared.
          items:
            $ref: '#/components/schemas/ChatTurn'
    ChatTurn:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          maxLength: 2000
    ChatCitation:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
          nullable: true
        modelName:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        iterationId:
          type: string
          nullable: true
        insertedAt:
          type: string
          format: date-time
          nullable: true
        chunkIndex:
          type: integer
          nullable: true
        score:
          type: number
          format: float
          nullable: true
    ChatResponse:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/ChatCitation'
