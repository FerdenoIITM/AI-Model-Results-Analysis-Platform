# Dev override: hot reload with the source mounted (no image rebuild on every edit).
#   make dev        # start      make down ENV=dev   # stop
# Web: Vite HMR. API: Spring Boot restarts when .java files change (built inside the container).
# Postgres: the host database (POSTGRES_HOST in .env.dev), or COMPOSE_PROFILES=db for a container.

services:
  db:
    ports:
      - "${DB_PORT:?set DB_PORT in the env file}:5432"

  ollama:
    ports:
      - "${OLLAMA_PORT:?set OLLAMA_PORT in the env file}:11434"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.dev.Dockerfile
    ports:
      - "${API_PORT:?set API_PORT in the env file}:${API_INTERNAL_PORT:-8080}"
    volumes:
      # Read-only: the container builds in its own copy, so its target/ never touches the host's.
      - ./apps/api:/src/apps/api:ro
      - m2_cache:/root/.m2
    healthcheck:
      disable: true

  web:
    build: !reset null
    image: ${NODE_IMAGE:-node:20-alpine}
    working_dir: /app
    environment:
      # Browser calls same-origin /api; Vite proxies it to the api service.
      VITE_PROXY_TARGET: http://api:${API_INTERNAL_PORT:-8080}
    ports:
      - "${WEB_PORT:?set WEB_PORT in the env file}:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  m2_cache:
  web_node_modules:
