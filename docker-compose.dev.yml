# Hot-reload development stack (source mounted — no image rebuild on every edit).
# Usage:
#   make down          # free ports if the packaged stack is running
#   make dev           # api + web with live reload
#   make dev-down
#
# Web: Vite HMR (instant). API: Spring Boot restarts when .java files change.
# Postgres: still your host DB via POSTGRES_* in .env (host.docker.internal).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: amrap-ollama-dev
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - amrap_ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: amrap-ollama-init-dev
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for ollama server..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling embedding model: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
        echo "Pulling chat model: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}"
        ollama pull ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
        echo "Models ready."
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.dev.Dockerfile
    container_name: amrap-api-dev
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-amrap}
      POSTGRES_USER: ${POSTGRES_USER:-amrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      API_PORT: 8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      RESULTS_STORAGE_DIR: ${RESULTS_STORAGE_DIR:-/var/amrap/results}
      INGEST_API_KEY: ${INGEST_API_KEY:-change-me-ingest-key}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./data/results:/var/amrap/results
      - amrap_m2_cache:/root/.m2
    depends_on:
      - ollama

  web:
    image: node:20-alpine
    container_name: amrap-web-dev
    restart: unless-stopped
    working_dir: /app
    environment:
      # Browser calls same origin /api; Vite proxies to the api service.
      VITE_PROXY_TARGET: http://api:8080
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - amrap_web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  amrap_m2_cache:
  amrap_web_node_modules:
  amrap_ollama_data:
