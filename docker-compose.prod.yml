# Prod override: built images. Only the web port is published; the API and Ollama
# (and the db container, if enabled) are reachable only inside the compose network.
#   make prod       # start      make down ENV=prod   # stop
# Postgres: the host database (POSTGRES_HOST in .env.prod), or COMPOSE_PROFILES=db for a container.

services:
  api:
    depends_on:
      db:
        condition: service_healthy
        required: false

  web:
    ports:
      - "${WEB_PORT:?set WEB_PORT in the env file}:80"
    depends_on:
      api:
        condition: service_healthy
