# AMRAP — api + web + ollama against local PostgreSQL (no in-compose database by default).
# Optional: docker compose --profile local-db up  (only if you want a containerized Postgres)

services:
  db:
    profiles: ["local-db"]
    # pgvector/pgvector image = Postgres 16 + pgvector extension preinstalled.
    # If you use host Postgres instead, install pgvector-16 on the host first.
    image: pgvector/pgvector:pg16
    container_name: amrap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amrap}
      POSTGRES_USER: ${POSTGRES_USER:-amrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amrap} -d ${POSTGRES_DB:-amrap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local LLM + embedding server. First boot downloads models (slow); cached in ollama_data.
  ollama:
    image: ollama/ollama:latest
    container_name: amrap-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot sidecar that pulls the embedding + chat models the first time compose comes up.
  ollama-init:
    image: ollama/ollama:latest
    container_name: amrap-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for ollama server..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling embedding model: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
        echo "Pulling chat model: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}"
        ollama pull ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
        echo "Models ready."
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: amrap-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-amrap}
      POSTGRES_USER: ${POSTGRES_USER:-amrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      API_PORT: 8080
      # RAG / LLM
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      RESULTS_STORAGE_DIR: ${RESULTS_STORAGE_DIR:-/var/amrap/results}
      INGEST_API_KEY: ${INGEST_API_KEY:-change-me-ingest-key}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Raw result JSON files live on the host so they survive container rebuilds.
      - ./data/results:/var/amrap/results
    depends_on:
      - ollama

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: amrap-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: amrap-nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  ollama_data:
