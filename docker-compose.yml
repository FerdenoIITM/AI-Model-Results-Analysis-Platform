# AMRAP — services shared by every environment (dev, test, prod).
# Not meant to run alone: every value comes from an environment file and each environment
# adds its own override file. `make dev`, `make test` and `make prod` run, for example:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# COMPOSE_PROJECT_NAME in the env file keeps containers, networks and volumes of each environment apart.

services:
  # Dedicated Postgres + pgvector, enabled with COMPOSE_PROFILES=db (test and prod).
  # Dev normally uses the Postgres installed on the host instead.
  db:
    profiles: ["db"]
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      CHAT_DB_USER: ${CHAT_DB_USER:-amrap_chat_ro}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied once, when the data volume is empty.
      - ./infra/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # Local LLM + embedding server (NVIDIA GPU via Container Toolkit).
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # One-shot sidecar that pulls the embedding and chat models (no-op once they are cached).
  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in the env file}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:?set OLLAMA_EMBED_MODEL in the env file}
      OLLAMA_CLASSIFY_MODEL: ${OLLAMA_CLASSIFY_MODEL:-qwen2.5:3b}
      OLLAMA_SQL_MODEL: ${OLLAMA_SQL_MODEL:-qwen2.5-coder:7b}
      OLLAMA_ANSWER_MODEL: ${OLLAMA_ANSWER_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for ollama server..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        for m in "$$OLLAMA_EMBED_MODEL" "$$OLLAMA_CLASSIFY_MODEL" "$$OLLAMA_SQL_MODEL" "$$OLLAMA_ANSWER_MODEL"; do
          echo "Pulling model: $$m"
          ollama pull "$$m"
        done
        echo "Models ready."
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      TZ: ${TZ:-UTC}
      API_PORT: ${API_INTERNAL_PORT:-8080}
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in the env file}
      POSTGRES_PORT: ${POSTGRES_PORT:?set POSTGRES_PORT in the env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the env file}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in the env file}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in the env file}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:?set OLLAMA_EMBED_MODEL in the env file}
      OLLAMA_CLASSIFY_MODEL: ${OLLAMA_CLASSIFY_MODEL:-qwen2.5:3b}
      OLLAMA_SQL_MODEL: ${OLLAMA_SQL_MODEL:-qwen2.5-coder:7b}
      OLLAMA_ANSWER_MODEL: ${OLLAMA_ANSWER_MODEL:-qwen2.5:7b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      CHAT_DB_USER: ${CHAT_DB_USER:-amrap_chat_ro}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-}
      RESULTS_STORAGE_DIR: ${RESULTS_STORAGE_DIR:-/var/amrap/results}
      RAG_WORKER_DELAY_MS: ${RAG_WORKER_DELAY_MS:-10000}
      RAG_WORKER_BATCH_SIZE: ${RAG_WORKER_BATCH_SIZE:-5}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      RAG_TOP_K: ${RAG_TOP_K:-6}
    volumes:
      - ${RESULTS_VOLUME:?set RESULTS_VOLUME in the env file}:${RESULTS_STORAGE_DIR:-/var/amrap/results}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${API_PORT}/actuator/health\" | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      - ollama

  # Built single-page app served by nginx, which also proxies /api to the api service,
  # so the browser never needs to know the API's host or port.
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:${API_INTERNAL_PORT:-8080}
    depends_on:
      - api

volumes:
  postgres_data:
  results_data:
  # Shared by every environment so models are downloaded once (created by the Makefile).
  ollama_models:
    name: ${OLLAMA_MODELS_VOLUME:?set OLLAMA_MODELS_VOLUME in the env file}
    external: true
