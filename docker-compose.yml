# AI Model Results Analysis Platform — service orchestration
# Scaffold only: images/build contexts are placeholders until implementation.

services:
  db:
    image: postgres:16-alpine
    container_name: amrap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amrap}
      POSTGRES_USER: ${POSTGRES_USER:-amrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amrap} -d ${POSTGRES_DB:-amrap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: amrap-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-amrap}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-amrap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: amrap-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: amrap-nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

  # Optional: enable when LLM is extracted from apps/api/api-llm
  # llm:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/llm.Dockerfile
  #   container_name: amrap-llm
  #   profiles: ["llm"]
  #   depends_on:
  #     - api

volumes:
  postgres_data:
