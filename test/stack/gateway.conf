# Test-only reverse proxy: serves the built web app and the API from one origin,
# so the browser bundle can be built with VITE_API_BASE_URL=/api.
server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
  }
}
